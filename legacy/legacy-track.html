const TRACKS=[{"key":"Viewer","name":"Map Viewer","icon":"map","ch":[{"t":"Getting around","num":"1","l":[{"id":"Viewer-1-1","t":"The workspace at a glance","num":"1.1","xp":20,"b":[{"t":"Three areas","h":"<p>The screen has three areas: the <strong>toolbar</strong> along the top, the <strong>layer panel</strong> on the left and the <strong>map</strong> in the centre. Almost every support call starts by asking the user which of the three they are looking at.</p>","f":["Viewer_1"]},{"t":"Who sees what","h":"<p>The layers listed in the panel depend on the groups the user belongs to. Two people on the same screen can see different layer lists, and that is expected.</p>","f":[]}],"q":[{"q":"A user says a layer is missing from the panel, but a colleague can see it. What is the most likely cause?","o":["The browser cache","The two users are in different groups","The layer was deleted","The map is zoomed out"],"a":1,"e":"The layer list is filtered by group permissions."}]},{"id":"Viewer-1-2","t":"Pan, zoom and extents","num":"1.2","xp":20,"b":[{"t":"Moving around","h":"<p>Drag to pan, scroll to zoom. The <em>zoom to extent</em> button brings the whole city back into view, which is the quickest way out when a user is lost over an empty area.</p>","f":["Viewer_2"]}],"q":[{"q":"Complete the sentence.","s":"When the user is lost over an empty area, use _____ to bring the city back.","o":["zoom to extent","the print tool","the audit log"],"a":0,"e":"When the user is lost over an empty area, use zoom to extent to bring the city back."},{"q":"Which action pans the map?","o":["Scrolling","Dragging","Double right-click"],"a":1,"e":"Dragging pans; scrolling zooms."}]},{"id":"Viewer-1-3","t":"Finding an address","num":"1.3","xp":25,"b":[{"t":"Search box","h":"<p>The search box accepts a street address or a parcel code. Results are pinned on the map; clicking the pin opens the parcel.</p><ul><li>Start with the street name, then the number.</li><li>Parcel codes are searched exactly.</li></ul>","f":["Viewer_3"]}],"q":[{"q":"Which toolbar button is highlighted in this screenshot?","o":["Search","Measure","Edit","Print"],"a":0,"e":"The first button opens the search box.","img":"Viewer_3"}]}]},{"t":"Reading the map","num":"2","l":[{"id":"Viewer-2-1","t":"Turning layers on and off","num":"2.1","xp":20,"b":[{"t":"Visibility","h":"<p>Tick a layer in the panel to draw it. Some layers only draw below a certain scale: if a ticked layer does not appear, ask the user to zoom in before opening a ticket.</p>","f":["Viewer_4"]}],"q":[{"q":"A ticked layer does not draw. What do you ask first?","o":["To reinstall the browser","To zoom in","To log out"],"a":1,"e":"Many layers have a minimum scale and only draw when zoomed in."},{"q":"Complete the sentence.","s":"Layers that only draw below a certain _____ look missing when zoomed out.","o":["scale","colour","group"],"a":0,"e":"Layers that only draw below a certain scale look missing when zoomed out."}]},{"id":"Viewer-2-2","t":"Identify and measure","num":"2.2","xp":25,"b":[{"t":"Identify","h":"<p>Clicking a feature with the identify tool lists its attributes. If nothing is listed, the click probably hit an area with no feature.</p>","f":[]},{"t":"Measure","h":"<p>The measure tool draws a line or an area and shows the length in metres. Double-click to finish.</p>","f":["Viewer_5"]}],"q":[{"q":"How does the user finish a measurement?","o":["Pressing Esc","Double-clicking","Closing the panel"],"a":1,"e":"A double-click closes the line or area."}]},{"id":"Viewer-2-3","t":"Chapter review","num":null,"xp":40,"boss":true,"b":[],"q":[{"q":"Where is the list of layers?","o":["Toolbar","Left panel","Map footer"],"a":1,"e":"Layers live in the left panel."},{"q":"What does zoom to extent do?","o":["Shows the whole city","Prints the map","Opens the search"],"a":0,"e":"It zooms back to the full city extent."},{"q":"The identify tool shows nothing after a click. Most likely?","o":["Server down","The click missed every feature","Wrong password"],"a":1,"e":"An empty identify result usually means the click hit no feature."}]}]}]},{"key":"Edit","name":"Layer Editing","icon":"pen","ch":[{"t":"Edit sessions","num":"3","l":[{"id":"Edit-3-1","t":"Starting an edit session","num":"3.1","xp":20,"b":[{"t":"The pencil","h":"<p>Select a layer in the panel and press the pencil. The button stays grey when the user's group can view the layer but not edit it.</p>","f":["Edit_1"]}],"q":[{"q":"The pencil is grey for one layer only. Why?","o":["The layer is view-only for the user's group","The browser is outdated","The map is too far out"],"a":0,"e":"Edit rights are granted per layer and per group."}]},{"id":"Edit-3-2","t":"Drawing a new parcel","num":"3.2","xp":30,"b":[{"t":"Vertex by vertex","h":"<p>Click to add each vertex and double-click to close the polygon. The attribute form opens as soon as the polygon is closed.</p>","f":["Edit_2"]}],"q":[{"q":"When does the attribute form open?","o":["Before the first vertex","After the polygon is closed","Only after saving"],"a":1,"e":"Closing the polygon opens the form."},{"q":"Complete the sentence.","s":"A double-click _____ the polygon.","o":["deletes","closes","moves"],"a":1,"e":"A double-click closes the polygon."}]},{"id":"Edit-3-3","t":"Snapping","num":"3.3","xp":25,"b":[{"t":"Why snap","h":"<p>With snapping on, a new vertex jumps to the nearest existing vertex. Neighbouring parcels then share the border exactly, with no gaps or slivers.</p>","f":[]}],"q":[{"q":"What problem does snapping prevent?","o":["Slow drawing","Gaps and slivers between neighbours","Wrong colours"],"a":1,"e":"Shared borders stay exact."}]}]},{"t":"Attributes and saving","num":"4","l":[{"id":"Edit-4-1","t":"The attribute form","num":"4.1","xp":25,"b":[{"t":"Required fields","h":"<p>Fields marked with an asterisk are required; the form will not save while one is empty. Drop-down fields only accept values from their list.</p>","f":["Edit_3"]},{"t":"Undo","h":"<p>While drawing, the undo b
